services:
  db:
    image: postgres:15-alpine
    container_name: db-imobiliaria
    ports:
      - "5434:5434"
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - ./api_db:/var/lib/postgres/data
    command: -p 5434
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -p 5434 -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      retries: 5

  api:
    build: .
    container_name: imobiliaria-api
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_JPA_DATABASE_PLATFORM=org.hibernate.dialect.PostgreSQLDialect
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5434/${DB_NAME}
      - SPRING_DATASOURCE_USERNAME=${DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
